# Packages allowed (true) or refused (false) to run install scripts.
# - unrs-resolver (eslint-plugin-import) ships prebuilt binaries.
allowBuilds:
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@expo/ui@57.0.21'
  - expo-constants@57.0.20
  - expo-modules-core@57.0.20
  - expo-router@57.0.24
  - expo-updates@57.0.24
  - expo@57.0.26
